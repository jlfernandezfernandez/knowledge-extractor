<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Extractor</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1c1b19; --muted: #6b675f; --line: #e2ded6;
    --card: #ffffff; --accent: #b4501e; --ok: #2f6f4f; --warn: #9a6b12;
    --old: #f6e8e6; --new: #e6f1ea; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --fg: #eae7e1; --muted: #9a938a; --line: #2f2c28;
      --card: #1e1c1a; --accent: #e0793f; --ok: #6cc79a; --warn: #d6a53c;
      --old: #34211f; --new: #1c2f26;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  header { border-bottom: 1px solid var(--line); padding: 18px 24px; display: flex;
    align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  header nav { margin-left: auto; display: flex; gap: 6px; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 24px 80px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  textarea, input {
    width: 100%; background: var(--card); color: var(--fg); font: inherit;
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  textarea { min-height: 190px; resize: vertical; }
  button {
    font: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.rec { color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px; }
  .card textarea { min-height: 68px; border: none; padding: 0; background: none; }
  .card input.title { border: none; padding: 0; background: none; font-weight: 600; }
  .tags { color: var(--muted); font-size: 13px; font-family: var(--mono); }
  .del { color: var(--muted); border: none; background: none; padding: 2px 6px; }
  .steps { display: flex; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 24px; }
  .steps b { color: var(--fg); }
  .conflict { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px;
    overflow: hidden; background: var(--card); }
  .conflict .head { padding: 10px 14px; border-bottom: 1px solid var(--line);
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .badge { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); }
  .badge.conflict { color: var(--accent); border-color: var(--accent); }
  .badge.duplicate { color: var(--muted); }
  .badge.refines { color: var(--warn); border-color: var(--warn); }
  .reason { color: var(--muted); font-size: 13px; }
  /* pre-wrap belongs on the leaf rows only: on the container it would also render
     the whitespace between the child elements as blank lines. */
  .diff { font-family: var(--mono); font-size: 13px; padding: 8px 0; }
  .diff > div { white-space: pre-wrap; padding: 2px 14px; }
  .diff .marker { color: var(--muted); }
  .diff .old { background: var(--old); }
  .diff .new { background: var(--new); }
  .choices { padding: 10px 14px; display: flex; gap: 8px; flex-wrap: wrap;
    border-top: 1px solid var(--line); }
  .merge { padding: 0 14px 12px; display: none; }
  .merge.show { display: block; }
  .note { color: var(--muted); font-size: 13px; }
  .err { color: var(--accent); }
  .item { border-bottom: 1px solid var(--line); padding: 12px 0; }
  .item b { display: block; }
  .hidden { display: none; }
  .spin::after { content: "…"; }
</style>
</head>
<body>
<header>
  <h1>Knowledge Extractor</h1>
  <span class="sub">capture → confirm → resolve → commit</span>
  <nav>
    <button id="nav-capture" class="on">Capture</button>
    <button id="nav-browse">Browse</button>
  </nav>
</header>

<main>
  <section id="view-capture">
    <div class="steps">
      <span id="s1"><b>1. Capture</b></span> <span>→</span>
      <span id="s2">2. What I understood</span> <span>→</span>
      <span id="s3">3. Conflicts</span> <span>→</span>
      <span id="s4">4. Committed</span>
    </div>

    <!-- Step 1 -->
    <section id="step1">
      <h2>Tell me what you know</h2>
      <textarea id="raw" placeholder="Talk or type. Ramble freely — the model will split it into discrete claims and show you what it understood before anything is stored."></textarea>
      <div class="row">
        <input id="author" placeholder="Your name (optional)" style="max-width: 220px">
        <button id="record" class="rec">● Record</button>
        <button id="extract" class="primary">Extract knowledge</button>
        <span id="cap-status" class="note"></span>
      </div>
    </section>

    <!-- Step 2 -->
    <section id="step2" class="hidden">
      <h2>This is what I understood — edit or delete anything that is wrong</h2>
      <div id="atoms"></div>
      <div class="row">
        <button id="back1">← Back</button>
        <button id="check" class="primary">Check against knowledge base</button>
        <span id="check-status" class="note"></span>
      </div>
    </section>

    <!-- Step 3 -->
    <section id="step3" class="hidden">
      <h2>Conflicts with what is already stored — you decide</h2>
      <div id="conflicts"></div>
      <div class="row">
        <button id="commit" class="primary">Commit to knowledge base</button>
        <span id="commit-status" class="note"></span>
      </div>
    </section>

    <!-- Step 4 -->
    <section id="step4" class="hidden">
      <h2>Committed</h2>
      <div id="committed"></div>
      <div class="row"><button id="again" class="primary">Capture something else</button></div>
    </section>
  </section>

  <section id="view-browse" class="hidden">
    <h2>Knowledge base</h2>
    <input id="q" placeholder="Semantic search… (empty = most recent)">
    <div id="items"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let sessionId = null, atoms = [], conflicts = [];

async function api(path, options) {
  const response = await fetch(path, {
    headers: { "Content-Type": "application/json" }, ...options,
  });
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.detail || `${response.status} ${response.statusText}`);
  }
  return response.json();
}

function busy(element, message) {
  element.textContent = message || "";
  element.className = message ? "note spin" : "note";
}
function failed(element, error) {
  element.className = "note err";
  element.textContent = error.message;
}
function show(step) {
  for (const n of [1, 2, 3, 4]) {
    $("step" + n).classList.toggle("hidden", n !== step);
    $("s" + n).innerHTML = n === step ? `<b>${$("s" + n).textContent.replace(/^\s+/, "")}</b>`
                                      : $("s" + n).textContent;
  }
}

// --- navigation -------------------------------------------------------
$("nav-capture").onclick = () => {
  $("view-capture").classList.remove("hidden");
  $("view-browse").classList.add("hidden");
  $("nav-capture").classList.add("on"); $("nav-browse").classList.remove("on");
};
$("nav-browse").onclick = () => {
  $("view-browse").classList.remove("hidden");
  $("view-capture").classList.add("hidden");
  $("nav-browse").classList.add("on"); $("nav-capture").classList.remove("on");
  loadItems("");
};

// --- step 1: capture --------------------------------------------------
let recorder = null;
$("record").onclick = async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (event) => chunks.push(event.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      $("record").textContent = "● Record";
      busy($("cap-status"), "Transcribing");
      const form = new FormData();
      form.append("file", new Blob(chunks, { type: "audio/webm" }), "capture.webm");
      try {
        const result = await api("/api/transcribe", { method: "POST", body: form, headers: {} });
        $("raw").value = ($("raw").value + "\n" + result.text).trim();
        busy($("cap-status"), "");
      } catch (error) { failed($("cap-status"), error); }
    };
    recorder.start();
    $("record").textContent = "■ Stop";
  } catch (error) { failed($("cap-status"), error); }
};

$("extract").onclick = async () => {
  const text = $("raw").value.trim();
  if (!text) return;
  busy($("cap-status"), "Reading");
  try {
    const result = await api("/api/capture", {
      method: "POST",
      body: JSON.stringify({ text, author: $("author").value || null, source: "web" }),
    });
    sessionId = result.session_id;
    atoms = result.atoms;
    busy($("cap-status"), "");
    renderAtoms();
    show(2);
  } catch (error) { failed($("cap-status"), error); }
};

// --- step 2: confirm understanding ------------------------------------
function renderAtoms() {
  $("atoms").innerHTML = "";
  if (!atoms.length) {
    $("atoms").innerHTML = '<p class="note">No claims found. Try being more specific.</p>';
  }
  atoms.forEach((atom, index) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div style="display:flex;gap:8px;align-items:baseline">
        <input class="title" value="">
        <button class="del" title="Remove this claim">✕</button>
      </div>
      <textarea></textarea>
      <div class="tags"></div>`;
    card.querySelector(".title").value = atom.title;
    card.querySelector("textarea").value = atom.statement;
    card.querySelector(".tags").textContent = (atom.tags || []).map((t) => "#" + t).join(" ");
    card.querySelector(".title").oninput = (e) => (atoms[index].title = e.target.value);
    card.querySelector("textarea").oninput = (e) => (atoms[index].statement = e.target.value);
    card.querySelector(".del").onclick = () => {
      atoms.splice(index, 1);
      renderAtoms();
    };
    $("atoms").appendChild(card);
  });
}

$("back1").onclick = () => show(1);

$("check").onclick = async () => {
  busy($("check-status"), "Comparing against the knowledge base");
  try {
    const result = await api(`/api/sessions/${sessionId}/atoms`, {
      method: "POST",
      body: JSON.stringify({ atoms }),
    });
    conflicts = result.conflicts;
    busy($("check-status"), "");
    if (!conflicts.length) {
      $("conflicts").innerHTML =
        '<p class="note">No conflicts. Everything here is new to the knowledge base.</p>';
    } else {
      renderConflicts();
    }
    show(3);
  } catch (error) { failed($("check-status"), error); }
};

// --- step 3: resolve conflicts ----------------------------------------
const decisions = {};

function renderConflicts() {
  $("conflicts").innerHTML = "";
  for (const conflict of conflicts) {
    const atom = atoms.find((a) => a.id === conflict.atom_id);
    const node = document.createElement("div");
    node.className = "conflict";
    node.innerHTML = `
      <div class="head">
        <span class="badge ${conflict.verdict}">${conflict.verdict}</span>
        <strong></strong>
        <span class="reason"></span>
      </div>
      <div class="diff">
        <div class="marker">&lt;&lt;&lt;&lt;&lt;&lt;&lt; STORED</div>
        <div class="old"></div>
        <div class="marker">=======</div>
        <div class="new"></div>
        <div class="marker">&gt;&gt;&gt;&gt;&gt;&gt;&gt; INCOMING</div>
      </div>
      <div class="choices">
        <button data-a="keep_new">Take incoming</button>
        <button data-a="keep_old">Keep stored</button>
        <button data-a="keep_both">Keep both</button>
        <button data-a="merge">Merge…</button>
      </div>
      <div class="merge"><textarea placeholder="Write the merged claim"></textarea></div>`;
    node.querySelector("strong").textContent = conflict.existing_title;
    node.querySelector(".reason").textContent = conflict.reason;
    node.querySelector(".old").textContent = conflict.existing_statement;
    node.querySelector(".new").textContent = atom ? atom.statement : "(claim removed)";

    const merge = node.querySelector(".merge");
    const mergeText = merge.querySelector("textarea");
    mergeText.value = atom ? atom.statement : "";
    mergeText.oninput = () => {
      decisions[conflict.key] = { action: "merge", statement: mergeText.value };
    };
    for (const button of node.querySelectorAll(".choices button")) {
      button.onclick = () => {
        for (const other of node.querySelectorAll(".choices button")) other.classList.remove("on");
        button.classList.add("on");
        const action = button.dataset.a;
        merge.classList.toggle("show", action === "merge");
        decisions[conflict.key] =
          action === "merge" ? { action, statement: mergeText.value } : { action };
      };
    }
    $("conflicts").appendChild(node);
  }
}

$("commit").onclick = async () => {
  const missing = conflicts.filter((c) => !decisions[c.key]);
  if (missing.length) {
    failed($("commit-status"), new Error(`${missing.length} conflict(s) still undecided`));
    return;
  }
  busy($("commit-status"), "Writing");
  try {
    const result = await api(`/api/sessions/${sessionId}/resolve`, {
      method: "POST",
      body: JSON.stringify({ decisions }),
    });
    busy($("commit-status"), "");
    $("committed").innerHTML = result.committed.length
      ? result.committed
          .map(
            (c) =>
              `<div class="item"><b></b><span></span>${
                c.superseded.length
                  ? `<div class="note">replaced ${c.superseded.length} stored claim(s)</div>`
                  : ""
              }</div>`
          )
          .join("")
      : '<p class="note">Nothing was written — every claim was already covered.</p>';
    // Fill text via DOM so statements cannot inject markup.
    $("committed").querySelectorAll(".item").forEach((item, index) => {
      item.querySelector("b").textContent = result.committed[index].title;
      item.querySelector("span").textContent = result.committed[index].statement;
    });
    show(4);
  } catch (error) { failed($("commit-status"), error); }
};

$("again").onclick = () => {
  sessionId = null; atoms = []; conflicts = [];
  for (const key of Object.keys(decisions)) delete decisions[key];
  $("raw").value = "";
  show(1);
};

// --- browse -----------------------------------------------------------
let searchTimer = null;
$("q").oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadItems($("q").value.trim()), 300);
};

async function loadItems(query) {
  const result = await api(query ? `/api/search?q=${encodeURIComponent(query)}` : "/api/knowledge");
  $("items").innerHTML = "";
  if (!result.items.length) {
    $("items").innerHTML = '<p class="note">Nothing stored yet.</p>';
    return;
  }
  for (const item of result.items) {
    const node = document.createElement("div");
    node.className = "item";
    node.innerHTML = '<b></b><span></span><div class="tags"></div>';
    node.querySelector("b").textContent = item.title;
    node.querySelector("span").textContent = item.statement;
    node.querySelector(".tags").textContent =
      (item.tags || []).map((t) => "#" + t).join(" ") +
      (item.author ? `  — ${item.author}` : "");
    $("items").appendChild(node);
  }
}

// Deep link from the A2A agent: /?session=<id> resumes a pending review.
const pending = new URLSearchParams(location.search).get("session");
if (pending) {
  api(`/api/sessions/${pending}`).then((session) => {
    sessionId = session.id;
    atoms = session.payload.atoms;
    renderAtoms();
    show(2);
  }).catch((error) => failed($("cap-status"), error));
} else {
  show(1);
}
</script>
</body>
</html>
