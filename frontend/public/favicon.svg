<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    :root {
      --bg: #ffffff;
      --border: #e4e4e7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #27272a;
        --border: #3f3f46;
      }
    }
  </style>
  <rect width="32" height="32" rx="8" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="16" y="22" font-size="18" text-anchor="middle" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🦉</text>
</svg>
