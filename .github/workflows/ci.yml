name: CI

on:
  push:
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --directory backend --frozen --extra dev
      - run: uv run --directory backend pytest -q --ignore=tests/integration

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: knowli
          POSTGRES_PASSWORD: knowli
          POSTGRES_DB: knowli
        options: >-
          --health-cmd "pg_isready -U knowli -d knowli"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://knowli:knowli@localhost:5432/knowli
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --directory backend --frozen --extra dev
      - run: uv run --directory backend pytest -q tests/integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: docker compose -p knowli-e2e -f docker-compose.yml -f docker-compose.e2e.yml up --build --wait
      - run: npm --prefix frontend run test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
      - name: Stop E2E services
        if: always()
        run: docker compose -p knowli-e2e -f docker-compose.yml -f docker-compose.e2e.yml down --volumes
