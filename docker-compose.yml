name: knowli

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: knowli
      POSTGRES_PASSWORD: knowli
      POSTGRES_DB: knowli
    volumes:
      - knowli_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowli -d knowli"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "python -c 'from knowli.infrastructure.postgres.pool import init; init()' && exec uvicorn knowli.interfaces.http.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /opt/venv/lib/python3.12/site-packages/knowli"]
    environment:
      DATABASE_URL: postgresql://knowli:knowli@db:5432/knowli
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-ollama}
      MODEL_NAME: ${MODEL_NAME:-qwen3.5:9b}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-Systran/faster-whisper-small}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-local}
      TRANSCRIPTION_BASE_URL: ${TRANSCRIPTION_BASE_URL:-http://host.docker.internal:8000/v1}
      COOKIE_SECURE: "false"
    volumes:
      - ./backend/knowli:/opt/venv/lib/python3.12/site-packages/knowli
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; raise SystemExit(0 if urlopen('http://localhost:8000/api/health/ready').status == 200 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: ""
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${KNOWLI_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  knowli_pgdata:
    name: knowli_pgdata
