[project]
name = "knowli"
version = "0.2.0"
description = "Human-in-the-loop knowledge capture"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "langchain-openai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "fastembed>=0.8",
    "openai>=2.0",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.20",
    "langchain>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
knowli-api = "knowli.interfaces.http.main:main"
knowli-seed = "knowli.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
