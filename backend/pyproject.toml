[project]
name = "knowli"
version = "0.2.0"
description = "Human-in-the-loop knowledge capture: LangGraph pipeline, pgvector hybrid RAG, A2A + MCP surfaces"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    # Orchestration. LangGraph owns the multi-step workflow and its pauses;
    # LangChain owns provider-agnostic model access and structured output.
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "langchain>=1.3",
    "langchain-openai>=1.0",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    # Storage
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    # Local embeddings and speech, both ONNX on CPU, neither pulling torch
    "fastembed>=0.8",
    "sherpa-onnx>=1.13",
]

[project.optional-dependencies]
# Only needed for SPEECH_PROVIDER=whisper; Parakeet works out of the box.
whisper = ["faster-whisper>=1.1"]
a2a = ["a2a-sdk[http-server]>=1.1"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
knowli-api = "knowli.interfaces.http.main:main"
knowli-a2a = "knowli.interfaces.a2a.server:main"
knowli-mcp = "knowli.interfaces.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
