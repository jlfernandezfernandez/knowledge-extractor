[project]
name = "knowledge-extractor"
version = "0.1.0"
description = "Human-in-the-loop knowledge capture with git-style conflict resolution for a pgvector RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "fastembed>=0.8",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# Local audio transcription. Skip it if you only type knowledge in.
audio = ["faster-whisper>=1.1"]
# Expose the RAG to other agents over Google's Agent2Agent protocol.
a2a = ["a2a-sdk[http-server]>=1.1"]

[project.scripts]
knowledge-extractor = "ke.api:main"
ke-a2a = "ke.a2a:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ke"]
